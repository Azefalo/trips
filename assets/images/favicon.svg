<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7BAEC8"/>
      <stop offset="60%" stop-color="#9DC4DB"/>
      <stop offset="100%" stop-color="#B8D4E8"/>
    </linearGradient>
    <linearGradient id="mtnMain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8AAF86"/>
      <stop offset="45%" stop-color="#6E9870"/>
      <stop offset="100%" stop-color="#4E7054"/>
    </linearGradient>
    <linearGradient id="mtnFar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9AB4A8"/>
      <stop offset="100%" stop-color="#7A9698"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="32" height="32" rx="8"/>
    </clipPath>
  </defs>

  <rect width="32" height="32" rx="8" fill="url(#sky)"/>

  <g clip-path="url(#frame)">
    <rect width="32" height="32" fill="url(#sky)"/>

    <!-- Distant mountain — smaller, pushed to right background -->
    <path d="M22 32 L22 26 L25 20 L26.5 17.5 L28 20 L31 26 L32 24 L32 32 Z"
          fill="url(#mtnFar)" opacity="0.6"/>

    <!-- Main mountain — very wide, gentle slopes -->
    <path d="
      M-1 32 L-1 24
      C1 23.5 3 22.5 5 21.5
      C6.5 20.5 7.5 19.5 8.5 18
      C9.5 16.5 10.2 15 11 13.5
      C11.7 12 12.3 10.5 12.9 9.4
      C13.3 8.6 13.7 7.9 14.1 7.5
      C14.5 7.2 14.9 7.1 15.2 7.2
      L15.6 7.2
      C16 7.2 16.4 7.5 16.9 8.1
      C17.4 8.7 18 9.6 18.7 11
      C19.4 12.4 20.2 14.2 21 16
      C21.8 17.8 22.7 19.5 23.7 21
      C24.7 22.5 26 23.5 27.5 24.2
      C29 24.9 30.5 25 32 24.8
      L32 32 Z
    " fill="url(#mtnMain)"/>

    <!-- Left sunlit face highlight -->
    <path d="
      M15.2 7.2 C14.8 7.8 14.3 9 13.7 10.5
      C13.1 12 12.4 13.8 11.7 15.5
      C11 17 10.3 18.5 9.5 19.8
      C8.8 21 7.8 22 6.5 22.8 L5 23.5
      C6.5 22.5 7.8 21.3 8.8 19.8
      C9.7 18.4 10.5 16.8 11.2 15
      C11.9 13.2 12.6 11.3 13.2 9.8
      C13.7 8.5 14.2 7.6 14.7 7.3 Z
    " fill="#A8C8A0" opacity="0.28"/>

    <!-- Right shadow face -->
    <path d="
      M16 7.4 C16.5 8.3 17.2 9.8 17.9 11.5
      C18.7 13.4 19.5 15.5 20.4 17.5
      C21.2 19.4 22.2 21.2 23.4 22.6
      C24.4 23.8 25.6 24.6 27 25 L28.5 25.2
      C27 24.6 25.7 23.6 24.5 22.2
      C23.2 20.7 22.1 18.8 21.1 16.8
      C20.1 14.8 19.2 12.7 18.4 11
      C17.7 9.4 17.1 8.1 16.5 7.5 Z
    " fill="#2E4A34" opacity="0.2"/>


<!-- Ground depth -->
    <rect x="0" y="29.5" width="32" height="2.5" fill="#3E5E44" opacity="0.13"/>
  </g>
</svg>
